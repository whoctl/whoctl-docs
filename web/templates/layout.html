{{define "layout.html" -}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="{{.Root}}assets/whoctl.css">
<link rel="icon" href="{{.Root}}assets/logo.svg" type="image/svg+xml">
<link rel="alternate icon" href="{{.Root}}assets/favicon.ico">
<link rel="apple-touch-icon" href="{{.Root}}assets/logo-256.png">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{.Root}}index.html"><img class="logo" src="{{.Root}}assets/logo.svg" alt="" width="26" height="26"><span class="mark">whoctl</span><span class="brand-sub">docs</span></a>
  <nav class="topnav">
    <a href="{{.Root}}index.html">Home</a>
    <a href="{{.Root}}providers/index.html">Providers</a>
    <a href="https://github.com/whoctl">GitHub</a>
  </nav>
  {{if .Site.Version}}<span class="version">{{.Site.Version}}</span>{{end}}
</header>
{{.Body}}
<footer class="footer">
  <p>Built from the documentation each provider publishes with its releases.
  The tool, the SDK and every provider are on
  <a href="https://github.com/whoctl">github.com/whoctl</a>.</p>
</footer>
</body>
</html>
{{- end}}
