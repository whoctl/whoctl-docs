# Which providers the site covers, and where each one's documentation bundle is.
#
# This is the whole of the site's editorial control: a provider is added by
# adding a line here, and nothing in a provider's own repository can put it on
# the site or take it off.
#
# A bundle is published by `<provider> --docs-bundle` in that provider's release
# workflow. `latest` follows whatever it published most recently; pin a tag to
# hold a version.
#
# `repository` is a second, heavier job for the same file: the published
# releases of that repository are what the registry index is derived from, so a
# line here is also what makes a provider installable. Removing one takes the
# provider off the site and out of the index together, which is the point —
# documenting a version nobody can install, or serving one nobody documented,
# are both worse than serving neither.
#
# For local work against sibling checkouts, `make local` writes a
# providers.local.yaml pointing at them, and the build prefers it when present.
# Those entries have no repository: nothing is published, so nothing is indexed.
providers:
  - name: linux
    version: latest
    bundle: https://github.com/whoctl/whoctl-provider-linux/releases/latest/download/docs-bundle.json
    repository: whoctl/whoctl-provider-linux

  - name: steam
    version: latest
    bundle: https://github.com/whoctl/whoctl-provider-steam/releases/latest/download/docs-bundle.json
    repository: whoctl/whoctl-provider-steam

# aws and coredns are written and are not here yet, on purpose. A line in this
# file is two promises at once — documentation the site publishes, and a
# repository the registry index is derived from — and neither repository has
# been pushed or released. Adding a line that points at a release which does not
# exist fails the build, which is the design working: an unreadable bundle is
# never quietly skipped.
#
# They go in when they are released, in the same change:
#
#   - name: aws
#     version: latest
#     bundle: https://github.com/whoctl/whoctl-provider-aws/releases/latest/download/docs-bundle.json
#     repository: whoctl/whoctl-provider-aws
#
#   - name: coredns
#     version: latest
#     bundle: https://github.com/whoctl/whoctl-provider-coredns/releases/latest/download/docs-bundle.json
#     repository: whoctl/whoctl-provider-coredns
