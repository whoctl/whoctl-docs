name: ci

on:
  push:
    branches: [main]
  pull_request:

# whoctl-sdk-go is not published yet, so a standalone `go build` here cannot
# resolve it. The workspace is what a developer uses locally and it is what CI
# uses until the SDK is tagged — after that, `go mod tidy` writes a real require
# and the two checkout-and-workspace steps below come out.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: whoctl-docs
      - uses: actions/checkout@v4
        with:
          repository: whoctl/whoctl-sdk-go
          path: whoctl-sdk-go
      - uses: actions/setup-go@v5
        with:
          go-version-file: whoctl-docs/go.mod
      - name: workspace
        run: go work init ./whoctl-docs ./whoctl-sdk-go
      - name: gofmt
        working-directory: whoctl-docs
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: whoctl-docs
        run: go vet ./...
      - name: test
        working-directory: whoctl-docs
        run: go test ./...
